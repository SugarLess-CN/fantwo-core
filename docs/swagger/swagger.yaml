                data:
                  $ref: '#/definitions/dto.ArticleDto'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ResponseBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handler.ResponseBody'
