          $ref: '#/definitions/dto.EquippedDecorationDto'
        description: |-
          EquippedDecorations 佩戴中的装饰品，按 type 分组（avatar_frame / comment_bubble）。

          空时不传（不是 null、不是空对象）—— docs/21 §一 规则 ③。
          列表接口批量装配走「一次 IN 查询」，不做逐用户查询（见 service.attachUserDecorations）。
        type: object
      experience:
        example: 430
        type: integer
      follower_count:
        example: 128
        type: integer
      following_count:
        example: 36
        type: integer
      gender:
        example: FEMALE
        type: string
