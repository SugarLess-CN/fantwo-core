        type: string
      paidAt:
        description: PaidAt 支付成功时间；未成功时不传该字段（不是 null）。
        example: "2026-11-25T10:05:00Z"
        format: date-time
        type: string
      paymentMethod:
        description: PaymentMethod 支付渠道。
        enum:
        - ALIPAY
        - WECHAT
        - EPAY
        - BALANCE
        example: ALIPAY
        type: string
