  /article:
    get:
      description: 分页浏览文章，支持标题/分类/标签/类型/状态筛选；携带 token 时返回当前用户互动状态
      operationId: ArticleController_findAll
      parameters:
      - description: 页码，默认 1
        example: 1
        in: query
        name: page
        type: integer
      - description: 每页条数，默认 10
        example: 10
        in: query
        name: limit
        type: integer
      - description: 标题关键字
        example: 秋日
        in: query
        name: title
        type: string
      - description: 分类 ID
        example: 2b3c4d5e-0000-4f60-9bac-000000000002
        in: query
        name: category_id
        type: string
      - description: 标签 ID
        example: 1a2b3c4d-0000-4e5f-8a9b-000000000001
        in: query
        name: tag_id
        type: string
      - description: image/mixed/video，默认 all
        example: image
        in: query
        name: type
        type: string
      - description: 排序方式（缺省按 type 的默认排序）
        enum:
        - latest
        - popular
        - sort
        example: latest
        in: query
        name: sort
        type: string
      - description: 状态筛选，逗号分隔
        example: PUBLISHED
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.ResponsePageBody'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/dto.PageBody'
                  - properties:
                      list:
                        items:
                          $ref: '#/definitions/dto.ArticleDto'
                        type: array
                    type: object
              type: object
      summary: 文章列表
      tags:
      - 文章
    post:
      consumes:
      - application/json
      description: 提交文章（图片/混合/视频），入内容审核流程
      operationId: ArticleController_create
      parameters:
      - description: 请求体
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateArticleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.ResponseBody'
            - properties:
                data:
                  $ref: '#/definitions/dto.ArticleDto'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ResponseBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handler.ResponseBody'
      security:
      - BearerAuth: []
      summary: 创建文章
      tags:
      - 文章
  /article/{id}:
    delete:
      operationId: ArticleController_remove
      parameters:
      - description: 文章 ID
        example: 9f1d2e34-5678-4abc-9def-0123456789ab
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.ResponseBody'
            - properties:
                data:
                  $ref: '#/definitions/dto.DeleteResultDto'
              type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handler.ResponseBody'
      security:
      - BearerAuth: []
      summary: 删除文章
      tags:
      - 文章
    get:
      operationId: ArticleController_findOne
      parameters:
