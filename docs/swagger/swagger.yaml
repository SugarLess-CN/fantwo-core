  dto.OrderDto:
    properties:
      amount:
        description: |-
          Amount 订单金额，**单位：元**。模型侧是 decimal(10,2)，Go 侧 float64，
          dto 保持 float64 不改精度语义（改整数分会让前端所有金额计算失真）。
        example: 19.9
        type: number
      articleId:
        description: ArticleID 文章 ID（仅 type=ARTICLE 的订单有值）。
        example: 9f1d2e34-5678-4abc-9def-0123456789ab
        type: string
      authorId:
        description: |-
          AuthorID 卖家用户 ID。

          ⚠️ 会员订单（type=MEMBERSHIP）这里是**平台单哨兵值字面量 "1"**，
          不是真实用户 ID（对齐原仓库 authorId=1 的约定，见 order_service.go 的
          CreateMembershipOrder）。前端若用它反查用户会 404，需按 type 分支处理。
          已知问题 P3，本轮保持不动。
        example: 64b59ed4-1a2b-4c3d-8e9f-0123456789ab
        type: string
      createdAt:
        example: "2026-11-25T10:00:00Z"
        format: date-time
        type: string
      details:
        additionalProperties: true
        description: |-
          Details 订单详情（jsonb 透传）。内容随 type 变化：
          文章单含 articleId/articleTitle/remark，会员单含 plan/duration/basePrice/
          membershipLevel/membershipName/isLifetime/totalAmount，退款后多 refund 子对象。
          空时不传该字段（不是 null）；因为是动态结构，不具名成固定 DTO。
        type: object
      id:
        example: 3c4d5e6f-7a8b-4c9d-8e0f-112233445566
        type: string
      orderNo:
        description: OrderNo 订单号：ORDER + 毫秒时间戳 + 3 位随机（共 21 字符）。
        example: ORDER1764050000000123
        type: string
      paidAt:
        description: PaidAt 支付时间；未支付时不传该字段（不是 null）。
        example: "2026-11-25T10:05:00Z"
        format: date-time
        type: string
      paymentMethod:
        description: PaymentMethod 支付方式；未支付时为空串（不是 null）。
        enum:
        - ALIPAY
        - WECHAT
        - EPAY
        - BALANCE
        example: BALANCE
        type: string
      paymentOrderNo:
        description: PaymentOrderNo 第三方支付订单号；未支付时为空串。
        example: "2026112522001445361234567890"
        type: string
      remark:
        description: Remark 备注（中文业务数据，不翻译）；无备注时为空串。
        example: 请尽快开通
        type: string
      status:
        enum:
        - PENDING
        - PAID
        - CANCELLED
        - REFUNDED
        example: PENDING
        type: string
      title:
        description: |-
          Title 订单标题。**中文业务数据（data 内容不是 message），不要翻译**
          （AGENTS「响应契约与 i18n」第 8 条）。
        example: 充值VIP会员 1个月
        type: string
      type:
        enum:
        - MEMBERSHIP
        - PRODUCT
        - SERVICE
        - ARTICLE
        example: MEMBERSHIP
        type: string
      updatedAt:
        example: "2026-11-25T10:00:00Z"
        format: date-time
        type: string
      userId:
        description: UserID 买家用户 ID。
        example: 64b59ed4-1a2b-4c3d-8e9f-0123456789ab
        type: string
    type: object
