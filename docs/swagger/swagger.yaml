        in: query
        name: type
        type: string
      - description: 状态筛选，逗号分隔
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.ResponsePageBody'
            - properties:
