host: localhost:3000
info:
  contact:
    name: fantwo-core
    url: https://github.com/SugarLess-CN/fantwo-core
  description: PicArt 图片社区 API 文档（Go + Gin 重构版，与原 NestJS swagger.json 语义对齐）
  termsOfService: https://github.com/SugarLess-CN/fantwo-core
  title: PicArt API
  version: "1.0"
paths:
  /achievement:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.ResponsePageBody'
      summary: 成就列表
      tags:
      - 成就
    post:
      consumes:
      - application/json
      parameters:
      - description: achievementRequest
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.ResponseBody'
      security:
      - BearerAuth: []
      summary: 创建成就定义
      tags:
      - 成就
  /achievement/{id}:
    delete:
      parameters:
      - description: id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.ResponseBody'
      security:
      - BearerAuth: []
      summary: 删除成就定义
      tags:
      - 成就
    get:
      parameters:
      - description: 成就 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.ResponseBody'
      summary: 成就详情
      tags:
      - 成就
    patch:
      consumes:
      - application/json
      parameters:
      - description: id
        in: path
        name: id
        required: true
        type: string
      - description: 请求体
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.ResponseBody'
      security:
      - BearerAuth: []
      summary: 更新成就定义
      tags:
      - 成就
  /achievement/{id}/claim:
    post:
      parameters:
      - description: 成就 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.ResponseBody'
      security:
      - BearerAuth: []
      summary: 领取成就奖励
      tags:
      - 成就
  /achievement/claim-all:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.ResponseBody'
      security:
      - BearerAuth: []
      summary: 一键领取全部可领成就
      tags:
      - 成就
  /achievement/stats:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.ResponseBody'
      security:
      - BearerAuth: []
      summary: 我的成就进度统计
      tags:
      - 成就
  /article:
    get:
      description: 分页浏览文章，支持标题/分类/标签/类型/状态筛选；携带 token 时返回当前用户互动状态
      parameters:
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页条数，默认 10
        in: query
        name: limit
        type: integer
      - description: 标题关键字
        in: query
        name: title
        type: string
      - description: 分类 ID
        in: query
        name: categoryId
        type: string
      - description: 标签 ID
        in: query
        name: tagId
        type: string
      - description: image/mixed/video，默认 all
        in: query
        name: type
        type: string
      - description: 状态筛选，逗号分隔
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.ResponseBody'
      summary: 文章列表
      tags:
      - 文章
    post:
      consumes:
      - application/json
      description: 提交文章（图片/混合/视频），入内容审核流程
      parameters:
      - description: CreateArticleRequest
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.ResponseBody'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ResponseBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handler.ResponseBody'
      security:
      - BearerAuth: []
