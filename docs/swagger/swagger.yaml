basePath: /api/v1
definitions:
  dto.AchievementClaimAllResultDto:
    properties:
      claimed:
        example: 2
        type: integer
      total:
        example: 5
        type: integer
    type: object
  dto.AchievementClaimResultDto:
    properties:
      decoration_id:
        type: string
      exp:
        example: 5
        type: integer
      points:
        example: 10
        type: integer
    type: object
  dto.AchievementConditionDto:
    properties:
      extra:
        additionalProperties: true
        type: object
      target:
        example: 10
        type: integer
      type:
        example: ARTICLE_COUNT
        type: string
    type: object
  dto.AchievementDto:
    properties:
      claimed:
        example: false
        type: boolean
      claimed_at:
        format: date-time
        type: string
      code:
        example: FIRST_ARTICLE
        type: string
      completed:
        example: false
        type: boolean
      completed_at:
        description: 时间：空时不传（未完成无 completedAt，未领取无 claimedAt）
        format: date-time
        type: string
      condition:
        allOf:
        - $ref: '#/definitions/dto.AchievementConditionDto'
        description: Condition 完成条件（必有，jsonb 默认零值 {type:"",target:0}）
      created_at:
        format: date-time
        type: string
      description:
        example: 一句话说明
        type: string
      enabled:
        example: true
        type: boolean
      hidden:
        example: false
        type: boolean
      icon:
        example: https://cdn.example.com/badge.png
        type: string
      id:
        example: 64b59ed4-1a2b-4c3d-8e9f-0123456789ab
        type: string
      name:
        example: 初次创作
        type: string
      progress:
        description: 当前用户进度（未登录时 progress=0 / completed=false / claimed=false）
        example: 3
        type: integer
      rarity:
        example: COMMON
        type: string
      reward_decoration_id:
        example: 9f1d2e34-5678-4abc-9def-0123456789ab
        type: string
      reward_exp:
        example: 5
        type: integer
      reward_points:
        example: 10
        type: integer
      sort:
        example: 1
        type: integer
      type:
        example: ARTICLE
        type: string
      updated_at:
        format: date-time
        type: string
    type: object
  dto.AchievementStatsDto:
    properties:
      claimed:
        example: 1
        type: integer
      completed:
        example: 3
        type: integer
      completion_rate:
        example: "15.00"
        type: string
      total:
        example: 20
        type: integer
    type: object
  dto.AddPointsRequest:
    properties:
      amount:
        example: 100
        type: integer
      description:
        example: 活动补发
        type: string
      related_id:
        example: ORDER1234567890123456
        type: string
      related_type:
        example: order
        type: string
      source:
        example: ADMIN_ADJUST
        type: string
      valid_days:
        description: ValidDays 积分有效期天数，0 表示永久。
        example: 0
        type: integer
    required:
    - amount
    - source
    type: object
  dto.AdvertisementConfigDto:
    properties:
      article_bottom:
        example: ""
        type: string
      article_bottom_link:
        example: ""
        type: string
      article_sidebar:
        example: ""
        type: string
      article_sidebar_link:
        example: ""
        type: string
      article_top:
        example: ""
        type: string
      article_top_link:
        example: ""
        type: string
      enabled:
        example: false
        type: boolean
      global_notice:
        example: ""
        type: string
      home_banner:
        example: https://cdn.example.com/banner.png
        type: string
      home_banner_link:
        example: https://example.com/promo
        type: string
      raw:
        additionalProperties: true
        description: Raw 广告组的原始键值（含上面 11 个字段的源 key）。无配置时为 {}（不是 null）。
        type: object
    type: object
  dto.ApplyCertificationRequest:
    properties:
      description:
        example: 一句话说明
        type: string
      materials:
        items:
          type: string
        type: array
      organization_name:
        example: 某某工作室
        type: string
      real_name:
        example: 张三
        type: string
      slogan:
        example: 官方认证 · 签约摄影师
        type: string
      type:
        example: CREATOR
        type: string
    required:
    - type
    type: object
  dto.ArticleCollectionBriefDto:
    properties:
      id:
        example: 64b59ed4-1a2b-4c3d-8e9f-0123456789ab
        type: string
      is_public:
        example: true
        type: boolean
      name:
        example: 我的收藏
        type: string
      user_id:
        example: 64b59ed4-1a2b-4c3d-8e9f-0123456789ab
        type: string
    type: object
  dto.ArticleCollectionInfoDto:
    properties:
      article_id:
        example: 64b59ed4-1a2b-4c3d-8e9f-0123456789ab
        type: string
      collections:
        items:
          $ref: '#/definitions/dto.ArticleCollectionBriefDto'
        type: array
    type: object
  dto.ArticleDislikeRequest:
    properties:
      reason:
        example: 不感兴趣
        type: string
    type: object
  dto.ArticleDownloadRequest:
    properties:
      extraction_code:
        description: ExtractionCode 下载提取码（可空，与 password 是两回事）。
        example: abcd
        type: string
      password:
        description: Password 网盘分享密码（可空）。
        example: "1234"
        type: string
      type:
        description: Type 下载类型，取值固定 10 个（对齐原 DownloadType 枚举）。
        enum:
        - baidu
        - onedrive
        - google
        - quark
        - aliyun
        - dropbox
        - direct
        - lanzou
        - mega
        - other
        example: baidu
        type: string
      url:
        example: https://pan.baidu.com/s/1ABC123
        type: string
      visible_without_permission:
        description: VisibleWithoutPermission 文章设了门槛时该资源是否仍对无权限用户可见。
        example: false
        type: boolean
    required:
    - type
    - url
    type: object
  dto.ArticleDto:
    properties:
      activity_id:
        example: ""
        type: string
      allow_reprint:
        example: false
        type: boolean
      author:
        $ref: '#/definitions/dto.AuthorBriefDto'
      author_id:
        example: 9f1d2e34-5678-4abc-9def-0123456789ab
        type: string
      category:
        $ref: '#/definitions/dto.CategoryBriefDto'
      category_id:
        example: 2b3c4d5e-0000-4f60-9bac-000000000002
        type: string
      comment_count:
        example: 0
        type: integer
      content:
        example: <p>正文内容</p>
        type: string
      cover:
        example: https://cdn.example.com/cover.jpg
        type: string
      created_at:
        example: "2026-11-25T10:00:00Z"
        type: string
      download_count:
        example: 0
        type: integer
      downloads:
        description: |-
          Downloads 下载资源列表（对齐原 article.downloads 一对多）。

          空时输出 []（不是 null）—— 见 docs/21 §一 规则 ②。
        items:
          $ref: '#/definitions/dto.ArticleDownloadRequest'
        type: array
      favorite_count:
        example: 1
        type: integer
      featured_at:
        type: string
      id:
        example: 64b59ed4-1a2b-4c3d-8e9f-0123456789ab
        type: string
      images:
        items:
          type: string
        type: array
      is_disliked:
        example: false
        type: boolean
      is_favorited:
        example: false
        type: boolean
      is_featured:
        example: false
        type: boolean
      is_liked:
        example: false
        type: boolean
      is_pinned_on_profile:
        example: false
        type: boolean
      likes:
        example: 3
        type: integer
      list_require_login:
        example: false
        type: boolean
      pinned_at:
        type: string
      reaction_stats:
        additionalProperties:
          type: integer
        description: |-
          ReactionStats 各表情的计数（键固定为 like/love/haha/wow/sad/angry/dislike）。

          对齐原 buildEmptyReactionStats()：无表态时是**全 0 对象**，不是 null。
        type: object
      require_follow:
        example: false
        type: boolean
      require_login:
        example: false
        type: boolean
      require_membership:
        example: false
        type: boolean
      require_payment:
        example: false
        type: boolean
      shares:
        example: 0
        type: integer
      sort:
        example: 0
        type: integer
      status:
        example: PUBLISHED
        type: string
      summary:
        example: 一句话摘要
        type: string
      tags:
        items:
          $ref: '#/definitions/dto.TagBriefDto'
        type: array
      title:
        example: 我的第一篇作品
        type: string
      type:
        example: image
        type: string
      updated_at:
        example: "2026-11-25T10:00:00Z"
        type: string
      user_reaction:
        description: UserReaction 当前用户对该文章的表态；未表态或未登录时为 ""（不是 null）。
        example: like
        type: string
      video_url:
        example: https://cdn.example.com/v.mp4
        type: string
      view_price:
        example: 0
        type: number
      views:
        example: 12
        type: integer
    type: object
  dto.ArticleLikeResultDto:
    properties:
      is_liked:
        example: true
        type: boolean
      likes:
        example: 13
        type: integer
      reaction_type:
        example: like
        type: string
    type: object
  dto.ArticleLikeStatusDto:
    properties:
      is_liked:
        example: false
        type: boolean
      reaction_type:
        example: like
        type: string
    type: object
  dto.ArticleReactionRequest:
    properties:
      reaction_type:
        enum:
        - like
        - love
        - haha
        - wow
        - sad
        - angry
        - dislike
        example: like
        type: string
    type: object
  dto.ArticleShareRequest:
    properties:
      channel:
        enum:
        - link
        - poster
        - wechat
        - moments
        - weibo
        - qq
        - other
        example: link
        type: string
    type: object
  dto.AssignMenusRequest:
    properties:
      menus:
        example:
        - '["dashboard"'
        - '"articles"]'
        items:
          type: string
        type: array
    type: object
  dto.AssignPermissionsRequest:
    properties:
      permission_ids:
        example:
        - '["article:create"'
        - '"article:update"]'
        items:
          type: string
        type: array
    type: object
  dto.AuditCertificationRequest:
    properties:
      reason:
        example: 违规内容
        type: string
      status:
        example: APPROVED
        type: string
    required:
    - status
    type: object
  dto.AuditConfigDto:
    properties:
      aliyun_access_key_id:
        description: Aliyun 阿里云 green（凭据字段不下发，见类型注释）。
        example: ""
        type: string
      aliyun_region:
        example: cn-shanghai
        type: string
      article_enabled:
        example: true
        type: boolean
      auto_block:
        description: |-
          AutoBlock 命中后的处置：true = 硬拦截（action=block，passed=false）；
          false = 放行但转人工（action=review，passed=true）。
        example: true
        type: boolean
      avatar_enabled:
        example: true
        type: boolean
      comment_enabled:
        description: 四类内容的审核开关（false = 该类型不送审，直接放行）。
        example: true
        type: boolean
      image_enabled:
        example: true
        type: boolean
      provider:
        description: Provider 审核服务商：none（仅本地敏感词）/ aliyun / tencent。
        enum:
        - none
        - aliyun
        - tencent
        example: none
        type: string
      review_mode:
        description: ReviewMode 审核模式：auto / manual。
        enum:
        - auto
        - manual
        example: auto
        type: string
      sensitivity:
        description: Sensitivity 敏感度：low / medium / high（默认 medium）。
        enum:
        - low
        - medium
        - high
        example: medium
        type: string
      tencent_image_biz:
        example: image_zh
        type: string
      tencent_region:
        example: ap-guangzhou
        type: string
      tencent_secret_id:
        description: Tencent 腾讯云 CMS（凭据字段不下发，见类型注释）。
        example: ""
        type: string
      tencent_text_biz:
        example: text_zh
        type: string
    type: object
  dto.AuditConfigReloadDto:
    properties:
      provider:
        enum:
        - none
        - aliyun
        - tencent
        example: none
        type: string
    type: object
  dto.AuditImageRequest:
    properties:
      url:
        example: https://cdn.example.com/a.png
        type: string
    required:
    - url
    type: object
  dto.AuditResultDto:
    properties:
      action:
        description: Action 处置动作，取值见上方说明。
        enum:
        - pass
        - review
        - block
        example: pass
        type: string
      detail_json:
        description: DetailJSON 云服务商原始响应（jsonb 文本透传）；无则空串。
        example: ""
        type: string
      label:
        description: Label 命中的标签（如 sensitive_word）；无命中时为空串。
        example: sensitive_word
        type: string
      passed:
        example: true
        type: boolean
      reason:
        description: Reason 命中原因（**中文业务数据**，不是 message，按 AGENTS 不翻译）。
        example: 命中本地敏感词：违禁词
        type: string
      score:
        description: Score 云服务商返回的风险分（0~100）；本地敏感词命中时为 0。
        example: 0
        type: number
    type: object
  dto.AuditReviewResultDto:
    properties:
      article_id:
        example: 9f1d2e34-5678-4abc-9def-0123456789ab
        type: string
      reason:
        example: 含违规内容
        type: string
      result:
        enum:
        - APPROVED
        - REJECTED
        example: APPROVED
        type: string
      reviewed_at:
        example: "2026-11-25T10:05:00Z"
        format: date-time
        type: string
      reviewed_by:
        example: 64b59ed4-1a2b-4c3d-8e9f-0123456789ab
        type: string
    type: object
  dto.AuditTextRequest:
    properties:
      content:
        example: 这是一段待审核的文本
        type: string
    required:
    - content
    type: object
  dto.AuthorBriefDto:
    properties:
      avatar:
        example: https://cdn.example.com/a.png
        type: string
      certification:
        allOf:
        - $ref: '#/definitions/dto.CertificationBriefDto'
        description: Certification 已通过的认证详情；未认证时不传。
      equipped_decorations:
        additionalProperties:
          $ref: '#/definitions/dto.EquippedDecorationDto'
        description: |-
          EquippedDecorations 作者当前佩戴的装饰品，按 type 分组。

          空时不传（不是 null、不是空对象）—— 见 docs/21 §一 规则 ③。
          对齐原 NestJS processUserDecorations()：Record<decorationType, Decoration>。
        type: object
      id:
        example: 9f1d2e34-5678-4abc-9def-0123456789ab
        type: string
      is_followed:
        example: false
        type: boolean
      nickname:
        example: 小明
        type: string
      username:
        example: xiaoming
        type: string
    type: object
  dto.BannerDto:
    properties:
      created_at:
        format: date-time
        type: string
      description:
        example: 一句话说明
        type: string
      id:
        example: 64b59ed4-1a2b-4c3d-8e9f-0123456789ab
        type: string
      image_url:
        example: https://cdn.example.com/banner.png
        type: string
      link_url:
        example: https://example.com/activity
        type: string
      sort_order:
        example: 1
        type: integer
      status:
        example: active
        type: string
      title:
        example: 双十一活动
        type: string
      updated_at:
        format: date-time
        type: string
    type: object
  dto.BatchDeleteBrowseRequest:
    properties:
      article_ids:
        items:
          type: string
        maxItems: 100
        minItems: 1
        type: array
    required:
    - article_ids
    type: object
  dto.BatchDeleteResultDto:
    properties:
      deleted:
        example: 3
        type: integer
    type: object
  dto.BatchMembershipCheckDto:
    properties:
      updated:
        example: 3
        type: integer
    type: object
  dto.BatchMessageRequest:
    properties:
      action:
        enum:
        - read
        - delete
        example: read
        type: string
      message_ids:
        items:
          type: string
        type: array
    required:
    - action
    - message_ids
    type: object
  dto.BindPhoneCodeRequest:
    properties:
      phone:
        example: "13800138000"
        type: string
    required:
    - phone
    type: object
  dto.BindPhoneRequest:
    properties:
      code:
        example: "123456"
        type: string
      phone:
        example: "13800138000"
        type: string
    required:
    - code
    - phone
    type: object
  dto.BindPhoneResultDto:
    properties:
      phone:
        example: "13800138000"
        type: string
      success:
        example: true
        type: boolean
    type: object
  dto.BlockResultDto:
    properties:
      blocked_user_id:
        example: 1a2b3c4d-5678-4abc-9def-0123456789ab
        type: string
      success:
        example: true
        type: boolean
    type: object
  dto.BlockUserRequest:
    properties:
      reason:
        example: 骚扰
        type: string
    type: object
  dto.BlockedUserDto:
    properties:
      blocked_user:
        $ref: '#/definitions/dto.MessageUserBriefDto'
      created_at:
        example: "2026-11-25T10:00:00Z"
        type: string
      id:
        example: 3c4d5e6f-0000-4a71-8cbd-000000000003
        type: string
      reason:
        example: 骚扰
        type: string
    type: object
  dto.BlockedUserListDto:
    properties:
      data:
        items:
          $ref: '#/definitions/dto.BlockedUserDto'
        type: array
    type: object
  dto.BrowseHistoryDto:
    properties:
      article:
        $ref: '#/definitions/dto.ArticleDto'
      article_id:
        example: 64b59ed4-1a2b-4c3d-8e9f-0123456789ab
        type: string
      duration:
        example: 120
        type: integer
      id:
        description: ID 浏览记录主键（唯一稳定 key；前端 keyExtractor / 去重用它，别再用 article_id@viewed_at
          拼）。
        example: 7f8e9d0c-1b2a-4c3d-8e9f-0123456789ab
        type: string
      progress:
        example: 80
        type: integer
      view_count:
        example: 2
        type: integer
      viewed_at:
        example: "2026-11-25T10:00:00Z"
        type: string
    type: object
  dto.BrowseProgressDto:
    properties:
      article_id:
        example: 64b59ed4-1a2b-4c3d-8e9f-0123456789ab
        type: string
      duration:
        example: 120
        type: integer
      progress:
        example: 80
        type: integer
    type: object
  dto.BrowseProgressRequest:
    properties:
      duration:
        example: 120
        minimum: 0
        type: integer
      progress:
        example: 80
        maximum: 100
        minimum: 0
        type: integer
    type: object
  dto.BrowseStatsDto:
    properties:
      avg_duration:
        example: 95.3
        type: number
      avg_progress:
        example: 62.5
        type: number
      total_articles:
        example: 12
        type: integer
      total_views:
        example: 37
        type: integer
    type: object
  dto.CalculateCommissionRequest:
    properties:
      amount:
        example: 100
        type: number
      type:
        example: article
        type: string
    required:
    - amount
    - type
    type: object
  dto.CategoryBriefDto:
    properties:
      avatar:
        example: https://cdn.example.com/cat.png
        type: string
      id:
        example: 2b3c4d5e-0000-4f60-9bac-000000000002
        type: string
      link:
        example: /category/2b3c4d5e
        type: string
      name:
        example: 摄影
        type: string
      status:
        example: ACTIVE
        type: string
    type: object
  dto.CategoryDto:
    properties:
      article_count:
        example: 128
        type: integer
      avatar:
        example: https://cdn.example.com/a.png
        type: string
      background:
        example: https://cdn.example.com/bg.png
        type: string
      children:
        description: Children 子分类（tree=true 或详情时填充；叶节点是 [] 不是 null）。
        items:
          $ref: '#/definitions/dto.CategoryDto'
        type: array
      cover:
        example: https://cdn.example.com/cover.png
        type: string
      created_at:
        format: date-time
        type: string
      description:
        example: 一句话说明
        type: string
      follow_count:
        example: 16
        type: integer
      id:
        example: 64b59ed4-1a2b-4c3d-8e9f-0123456789ab
        type: string
      link:
        example: https://example.com
        type: string
      name:
        example: 风景摄影
        type: string
      parent_id:
        example: 64b59ed4-1a2b-4c3d-8e9f-0123456789ab
        type: string
      sort:
        example: 1
        type: integer
      status:
        example: ENABLED
        type: string
      updated_at:
        format: date-time
        type: string
    type: object
  dto.CertificationBriefDto:
    properties:
      real_name:
        example: 张三
        type: string
      slogan:
        example: 记录光
        type: string
      type:
        example: OFFICIAL
        type: string
    type: object
  dto.CertificationDto:
    properties:
      certified_at:
        description: |-
          CertifiedAt 认证**通过**的时间；未通过 / 被拒 / 已撤销时整个字段不传。

          与 reviewed_at 是两回事：reviewed_at 是审核动作时间（拒绝也有），
          certified_at 是认证生效时间（只在 APPROVED 时存在）。见 model.UserCertification。
        example: "2026-11-27T10:00:00Z"
        format: date-time
