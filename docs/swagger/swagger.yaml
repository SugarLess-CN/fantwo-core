      price:
        example: 9.9
        type: number
      rarity:
        description: COMMON / RARE / EPIC / LEGENDARY
        example: COMMON
        type: string
      required_comments:
        example: 0
        type: integer
      required_likes:
        description: |-
          ---- 解锁门槛（同一交接单 §二.5 的「门槛文案」）----

          ⚠️ 事实核对：model.Decoration **没有** required_likes / required_comments 这两列
          （`grep -n "RequiredLikes" internal/model/decoration.go` 只命中 DecorationActivity）。
          所以这里**不是**装饰品自身的列，而是它的**来源活动**（activity_id 指向的
          decoration_activities 行）上声明的门槛 —— 对「活动获取」的装饰品这就是真实的
          解锁条件，不是编造。非活动来源（购买/赠送/成就）不传该字段（nil）。
          若产品需要「每个装饰品独立门槛」，必须给 decorations 表加列，那是另一个决策。
        example: 100
        type: integer
      sort:
        example: 0
        type: integer
      status:
        description: ACTIVE / INACTIVE
        example: ACTIVE
        type: string
      type:
        description: AVATAR_FRAME / COMMENT_BUBBLE / ACHIEVEMENT_BADGE
        example: AVATAR_FRAME
        type: string
      updated_at:
        example: "2026-11-25T10:00:05Z"
        format: date-time
        type: string
      valid_days:
        example: 30
        type: integer
    type: object
