        example: https://cdn.example.com/deco/frame.png
        type: string
      is_owned:
        description: |-
          ---- 归属 / 装备状态（前端交接单第三版 §二.5）----

          GET /decoration（商城列表）与 GET /decoration/{id} 会带上登录用户语境填充；
          管理端 CRUD、持有记录里的嵌套定义不计算归属，这两个字段**不传**。

          为什么是 *bool + omitempty 而不是 bool：
            - nil = 「本次响应没有归属语境」，整个字段不传（docs/21 对象/未计算态）；
            - false = **明确未拥有**，必须出现 —— 前端要靠它显示「未解锁」。
            直接用 bool + omitempty 会把 false 吃掉，前端永远看不到「未拥有」，
            等于装饰页仍然全坏的（这正是本次要修的缺陷）。
        example: false
        type: boolean
      is_permanent:
        example: false
        type: boolean
      is_purchasable:
        example: true
        type: boolean
      is_using:
        example: false
        type: boolean
      name:
        example: 金色边框
        type: string
      obtain_method:
        description: PURCHASE / ACTIVITY / GIFT / ACHIEVEMENT / DEFAULT
        example: PURCHASE
        type: string
      preview_url:
        example: https://cdn.example.com/deco/frame-preview.png
