basePath: /api/v1
definitions:
  internal_handler.ResponseBody:
    properties:
      data: {}
      message:
        example: Success
        type: string
      status_code:
        example: 200
        type: integer
      timestamp:
        example: 1795540372656
        type: integer
      trace_id:
        example: 4c3abb48-ddf2-4943-b685-ec4ec35449ed
        type: string
    type: object
  internal_handler.ResponsePageBody:
    properties:
      data:
        $ref: '#/definitions/internal_handler.ResponsePageInner'
      message:
        example: Success
        type: string
      status_code:
        example: 200
        type: integer
      timestamp:
        example: 1795540372656
        type: integer
      trace_id:
        example: 4c3abb48-ddf2-4943-b685-ec4ec35449ed
        type: string
    type: object
  internal_handler.ResponsePageInner:
    properties:
      list: {}
      meta:
        $ref: '#/definitions/internal_handler.ResponsePageMeta'
    type: object
  internal_handler.ResponsePageMeta:
    properties:
      limit:
        example: 10
        type: integer
      page:
        example: 1
        type: integer
      total:
        example: 100
        type: integer
      totalPages:
        example: 10
        type: integer
    type: object
  internal_handler.loginRequest:
    properties:
      account:
        type: string
      password:
        type: string
    type: object
host: localhost:3000
info:
  contact:
    name: fantwo-core
    url: https://github.com/SugarLess-CN/fantwo-core
  description: PicArt 图片社区 API 文档（Go + Gin 重构版，与原 NestJS swagger.json 语义对齐）
