  /article:
    get:
      description: 分页浏览文章，支持标题/分类/标签/类型/状态筛选；携带 token 时返回当前用户互动状态
      operationId: ArticleController_findAll
      parameters:
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页条数，默认 10
        in: query
        name: limit
        type: integer
      - description: 标题关键字
        in: query
        name: title
        type: string
      - description: 分类 ID
        in: query
        name: categoryId
        type: string
      - description: 标签 ID
        in: query
        name: tagId
        type: string
      - description: image/mixed/video，默认 all
        in: query
        name: type
        type: string
      - description: 状态筛选，逗号分隔
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.ResponseBody'
      summary: 文章列表
      tags:
      - 文章
    post:
      consumes:
      - application/json
      description: 提交文章（图片/混合/视频），入内容审核流程
      operationId: ArticleController_create
      parameters:
      - description: CreateArticleRequest
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.ResponseBody'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ResponseBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handler.ResponseBody'
      security:
      - BearerAuth: []
      summary: 创建文章
      tags:
      - 文章
