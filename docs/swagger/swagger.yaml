  /article:
    get:
      description: 分页浏览文章，支持标题/分类/标签/类型/状态筛选；携带 token 时返回当前用户互动状态
      parameters:
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页条数，默认 10
        in: query
        name: limit
        type: integer
      - description: 标题关键字
        in: query
        name: title
        type: string
      - description: 分类 ID
        in: query
        name: categoryId
        type: string
