        example: ""
        type: string
      aliyunRegion:
        example: cn-shanghai
        type: string
      articleEnabled:
        example: true
        type: boolean
      autoBlock:
        description: |-
          AutoBlock 命中后的处置：true = 硬拦截（action=block，passed=false）；
          false = 放行但转人工（action=review，passed=true）。
        example: true
        type: boolean
      avatarEnabled:
        example: true
        type: boolean
      commentEnabled:
        description: 四类内容的审核开关（false = 该类型不送审，直接放行）。
        example: true
        type: boolean
      imageEnabled:
        example: true
        type: boolean
      provider:
        description: Provider 审核服务商：none（仅本地敏感词）/ aliyun / tencent。
        enum:
        - none
        - aliyun
        - tencent
        example: none
        type: string
      reviewMode:
        description: ReviewMode 审核模式：auto / manual。
        enum:
        - auto
        - manual
        example: auto
        type: string
      sensitivity:
        description: Sensitivity 敏感度：low / medium / high（默认 medium）。
        enum:
        - low
        - medium
        - high
        example: medium
        type: string
      tencentImageBiz:
        example: image_zh
        type: string
      tencentRegion:
        example: ap-guangzhou
        type: string
      tencentSecretId:
        description: Tencent 腾讯云 CMS（凭据字段不下发，见类型注释）。
        example: ""
        type: string
      tencentTextBiz:
        example: text_zh
        type: string
    type: object
