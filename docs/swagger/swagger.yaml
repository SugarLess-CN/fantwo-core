info:
  contact:
    name: fantwo-core
    url: https://github.com/SugarLess-CN/fantwo-core
  description: PicArt 图片社区 API 文档（Go + Gin 重构版，与原 NestJS swagger.json 语义对齐）
  termsOfService: https://github.com/SugarLess-CN/fantwo-core
  title: PicArt API
  version: "1.0"
paths:
  /achievement:
    get:
      operationId: AchievementController_findAll
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.ResponsePageBody'
            - properties:
                data:
                  allOf:
                  - $ref: '#/definitions/dto.PageBody'
                  - properties:
                      list:
                        items:
                          $ref: '#/definitions/dto.AchievementDto'
                        type: array
                    type: object
              type: object
      summary: 成就列表
      tags:
      - 成就
    post:
      consumes:
      - application/json
      operationId: AchievementController_create
      parameters:
      - description: 请求体
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAchievementRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.ResponseBody'
            - properties:
                data:
                  $ref: '#/definitions/dto.AchievementDto'
              type: object
      security:
      - BearerAuth: []
      summary: 创建成就定义
      tags:
      - 成就
  /achievement/{id}:
    delete:
      operationId: AchievementController_remove
      parameters:
      - description: id
        example: 9f1d2e34-5678-4abc-9def-0123456789ab
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.ResponseBody'
            - properties:
                data:
                  $ref: '#/definitions/dto.DeleteResultDto'
              type: object
      security:
      - BearerAuth: []
      summary: 删除成就定义
      tags:
      - 成就
    get:
      operationId: AchievementController_findOne
      parameters:
      - description: 成就 ID
        example: 9f1d2e34-5678-4abc-9def-0123456789ab
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.ResponseBody'
            - properties:
                data:
                  $ref: '#/definitions/dto.AchievementDto'
              type: object
      summary: 成就详情
      tags:
      - 成就
    patch:
      consumes:
      - application/json
      operationId: AchievementController_update
      parameters:
      - description: id
        example: 9f1d2e34-5678-4abc-9def-0123456789ab
        in: path
        name: id
        required: true
        type: string
      - description: 请求体
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateAchievementRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.ResponseBody'
            - properties:
                data:
                  $ref: '#/definitions/dto.AchievementDto'
              type: object
      security:
      - BearerAuth: []
      summary: 更新成就定义
      tags:
      - 成就
  /achievement/{id}/claim:
    post:
      operationId: AchievementController_claimReward
      parameters:
