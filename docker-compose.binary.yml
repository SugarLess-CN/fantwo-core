# 预编译二进制部署编排（不含构建阶段）
#
# 与 docker-compose.yml 的区别：
#   docker-compose.yml        : app 服务有 build 段，容器内编译源码（需要 golang 镜像 + 外网）
#   docker-compose.binary.yml : app 服务只引用已构建好的镜像，不编译；且不含 Elasticsearch
#
# 前提：
#   1) 已构建镜像：  docker build -f Dockerfile.binary -t fantwo-core:1.0.0 .
#   2) 同目录有 .env（cp .env.example .env 后至少填 JWT_SECRET 与 POSTGRES_PASSWORD）
#
# 起栈：
#   docker compose -f docker-compose.binary.yml up -d
# 看日志：
#   docker compose -f docker-compose.binary.yml logs -f app
# 停栈（保留数据卷）：
#   docker compose -f docker-compose.binary.yml down
# 停栈并删卷（会丢数据库与上传文件，慎用）：
#   docker compose -f docker-compose.binary.yml down -v

name: fantwo-core

services:
  postgres:
    image: postgres:18-alpine
    container_name: fantwo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须设置}
      POSTGRES_DB: ${POSTGRES_DATABASE:-fantwo_core}
      LANG: C.UTF-8
    # 只在宿主机本地暴露，避免把 5432 直接开在公网
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DATABASE:-fantwo_core}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fantwo-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    # 用预先 build 好的镜像；如需升级，重新 build 一个 tag 再改这里
    image: ${APP_IMAGE:-fantwo-core:1.0.0}
    container_name: fantwo-core
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: "3000"
      SERVER_MODE: release
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: Asia/Shanghai

      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须设置}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-fantwo_core}
      POSTGRES_SSL_MODE: disable

      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 必须设置}
      JWT_ISSUER: fantwo-core
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-168h}

      # 存储：默认本地盘挂卷
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /app/uploads

      # 全文检索：不启用（未起 ES 时必须保持 false，否则 /search 会报错而非降级 5030）
      SEARCH_ENABLED: ${SEARCH_ENABLED:-false}

      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  redisdata:
  uploads: