# fantwo-core 配置模板
# 复制为 config.yaml 后按需修改；所有键均可被同名环境变量覆盖
# （层级键点号转下划线，如 postgres.host -> POSTGRES_HOST）。

server:
  port: 3000
  mode: debug            # debug / release / test

postgres:
  host: 127.0.0.1
  port: 5432
  user: postgres
  password: ""
  database: picart
  ssl_mode: disable      # disable / require / verify-full
  log_level: warn        # silent / error / warn / info

redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0

jwt:
  secret: change-me-in-production
  expires_in: 1h         # access token
  refresh_expires_in: 168h
  issuer: fantwo-core

log:
  level: info            # debug / info / warn / error
  format: console        # console / json
