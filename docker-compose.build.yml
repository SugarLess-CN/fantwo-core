# 源码构建编排（build 模式）—— 编译在容器内进行，宿主机不需要装 Go
#
# ══════════════════════════════════════════════════════════════════════════
#  本目录下的编排文件分工：
#
#    docker-compose.build.yml    （本文件）build 模式
#        拉 golang:1.26.11（1.23GB）→ go mod download → go build → 装进 alpine
#        首次 3~15 分钟，之后改代码重建约 30 秒
#        优点：宿主机零依赖，一条命令搞定
#
#    docker-compose.binary.yml   binary 模式
#        只 COPY 宿主机上已交叉编译好的 Linux 二进制，只拉 alpine（12MB）
#        约 5 秒构建
#        前提：宿主机先跑过
#              CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
#                go build -trimpath -ldflags="-s -w" \
#                -o dist/fantwo-core-linux-amd64 ./cmd/server
#
#    docker-compose.yml          兼容保留（多 target 版，靠 BUILD_TARGET 切换）
#        新部署请用上面两个显式文件
#
#  两种模式产出的运行镜像完全相同（同一个静态二进制 + 同一套运行环境）。
#
# ── 用法 ──────────────────────────────────────────────────────────────────
#      cp .env.build.example .env
#      docker compose -f docker-compose.build.yml up -d --build
#      curl http://127.0.0.1:8079/health
# ══════════════════════════════════════════════════════════════════════════
#
#  本编排只定义 app 一个服务。PostgreSQL / Redis / Elasticsearch 都在
#  【别的容器】里（1panel 应用商店装的，或独立部署），这里只管连接。
#
#  为什么只有一个服务：
#      生产环境的 PG/Redis/ES 通常由面板或 DBA 统一管理（备份、监控、升级），
#      和业务容器混在一个 compose 里会导致「删编排连库一起删」的事故。
#
# ── 关于网络（最关键的一步）───────────────────────────────────────────────
#  容器间用【容器名】互访，前提是它们在同一个 Docker 网络里。
#  先确认网络名：
#      docker inspect <PG容器名> --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}'
#  然后在 .env 里设 EXTERNAL_NETWORK=<那个网络名>。
#
#  如果 PG/Redis 是宿主机端口映射（不走容器名），把 EXTERNAL_NETWORK 留空，
#  并改用 host.docker.internal（见文件末尾 networks 段注释）。

# 项目名（决定资源名前缀：卷、网络、默认镜像名）。
# 与 binary 模式区分开，两套编排共存时不会抢同一批卷。
name: ${COMPOSE_PROJECT_NAME:-fantwo-core-build}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.binary
      # 本文件固定用 from-source（编译在容器内）
      target: from-source
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        WITH_FFMPEG: ${WITH_FFMPEG:-true}
    # ⚠️ 刻意不写 image: 字段。
    #
    # 原因：1panel 的「创建编排」会先对每个 service 的 image 执行 docker pull，
    # 再去 build。若写 `image: fantwo-core:latest`，1panel 会去 Docker Hub 拉
    # 一个不存在的镜像 → 报 "error from registry: denied" / 拉取超时，编排直接失败。
    #
    # 不写 image 时 compose 自动命名为 <项目名>-<服务名>（即 fantwo-core-app），
    # 1panel 找不到可拉取的远程名，就直接走 build。
    # pull_policy: build 是第二道保险（`docker compose pull` 会把 app 标记为 Skipped）。
    pull_policy: build
    # 容器名可覆盖：与 binary 模式默认名区分开，
    # 避免两套编排共存时争抢同名容器（Conflict: name already in use）。
    container_name: ${CONTAINER_NAME:-fantwo-core-build}
    restart: unless-stopped
    networks:
      - ext
    environment:
      # 容器内监听端口（应用读这个）
      SERVER_PORT: ${SERVER_PORT:-3000}
      SERVER_MODE: ${SERVER_MODE:-release}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-Asia/Shanghai}

      # ---- 数据库（外面已有的容器，用容器名或 IP）----
      POSTGRES_HOST: ${POSTGRES_HOST:?POSTGRES_HOST 必须设置（PG 容器名或 IP）}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须设置}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-fantwo_core}
      POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE:-disable}
      POSTGRES_LOG_LEVEL: ${POSTGRES_LOG_LEVEL:-warn}

      # ---- Redis（外面已有的容器）----
      REDIS_ADDR: ${REDIS_ADDR:?REDIS_ADDR 必须设置（如 redis:6379）}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}

      # ---- JWT ----
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 必须设置（用 openssl rand -hex 32 生成）}
      JWT_ISSUER: ${JWT_ISSUER:-fantwo-core}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-168h}

      # ---- 存储 ----
      # local：上传文件落 /app/uploads（挂卷）
      # s3：走对象存储，需同时配 S3_* 系列
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      # 容器内固定这个路径（挂卷点），不要改成 ./uploads
      STORAGE_LOCAL_DIR: /app/uploads
      # S3 七项与 CDN 只能在启动时生效，改了要重启容器：

      # ---- 全文检索（ES 在另一个容器）----
      # 不启用就设 SEARCH_ENABLED=false；/search 会降级返回 5030，其它业务不受影响。
      SEARCH_ENABLED: ${SEARCH_ENABLED:-false}
      SEARCH_ADDRESSES: ${SEARCH_ADDRESSES:-}
      SEARCH_USERNAME: ${SEARCH_USERNAME:-}
      SEARCH_PASSWORD: ${SEARCH_PASSWORD:-}
      SEARCH_ARTICLES_INDEX: ${SEARCH_ARTICLES_INDEX:-picart_articles}

      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    ports:
      # 映射规则：宿主机 SERVER_BIND_PORT → 容器 SERVER_PORT
      #
      #   SERVER_BIND_PORT  宿主机端口（默认 3000；1panel 面板常占 3000，可改 8079）
      #   SERVER_PORT       容器内监听端口（默认 3000，应用实际读这个）
      #   APP_BIND_IP       绑哪个网卡：
      #                       0.0.0.0（默认）→ 公网可直接访问
      #                       127.0.0.1     → 只能本机，交给 Nginx/Caddy 反代（更安全）
      #
      # ⚠️ 报 "Bind for 0.0.0.0:3000 failed: port is already allocated"：
      #    宿主机端口被占用。查是谁：
      #        ss -lntp | grep :3000       或   netstat -lntp | grep :3000
      #        docker ps --format '{{.Names}}\t{{.Ports}}' | grep 3000
      #    改 SERVER_BIND_PORT 即可，不必动占用者。
      - "${APP_BIND_IP:-0.0.0.0}:${SERVER_BIND_PORT:-3000}:${SERVER_PORT:-3000}"
    volumes:
      # 上传文件必须持久化，否则容器重建后用户图片全丢。
      # 用命名卷而非绑定挂载：镜像里 /app/uploads 的属主是 appuser(10001)，
      # 命名卷首次挂载会沿用该属主；绑定挂载会变成宿主机 root 属主 → 应用写不进去。
      # 想用绑定挂载（便于 1panel 备份）需先：chown 10001:10001 ./data/uploads
      - uploads:/app/uploads
    # Linux 下访问宿主机端口（PG/Redis 只在宿主机监听时用）
    # 日志上限（**必配**）：不配的话 Docker 默认 json-file 驱动无限增长，
    # 长期跑会把磁盘吃满（本项目一天正常量约几百 KB，但异常刷屏时无上限）。
    # 10MB × 3 个文件 = 单容器最多 30MB，滚动覆盖。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  uploads:

networks:
  # 外部网络（已存在，不由本 compose 创建）。
  # 名字用 .env 的 EXTERNAL_NETWORK 指定。
  #
  # ⚠️ 如果这个网络不存在，compose up 会报
  #    network xxx declared as external, but could not be found
  # 两种情况：
  #   a) 1panel 装的容器 → 先 docker network ls 确认真实名字，填进 .env
  #   b) PG/Redis 走宿主机端口 → 把 networks/ext 段和 app.networks 删掉，
  #      改用 POSTGRES_HOST=host.docker.internal（app 会自动用默认网络）
  ext:
    external: true
    name: ${EXTERNAL_NETWORK:-1panel-network}
