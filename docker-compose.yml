# 项目名显式指定：工作区目录名含中文，compose 无法据此生成项目名。
name: fantwo-core

# 本地一键起栈：PostgreSQL + Redis + Elasticsearch + 应用
#
# 用法：
#   cp .env.example .env      # 填 JWT_SECRET 等
#   docker compose up -d --build
#   curl http://localhost:3000/health
#
# 说明：ES 用单节点 + 关闭安全，仅适合本地开发；生产请走托管服务。

services:
  postgres:
    image: postgres:18-alpine
    container_name: fantwo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DATABASE:-fantwo_core}
      # 中文排序与大小写处理
      LANG: C.UTF-8
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DATABASE:-fantwo_core}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fantwo-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: fantwo-es
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fantwo-core
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: "3000"
      SERVER_MODE: release
      LOG_FORMAT: json
      LOG_LEVEL: info

      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-fantwo_core}
      POSTGRES_SSL_MODE: disable

      REDIS_ADDR: redis:6379

      # 必须替换：JWT 签名密钥（留空则服务无法签发令牌）
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 必须设置}
      JWT_ISSUER: fantwo-core

      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /app/uploads

      # 全文检索：不填 ELASTICSEARCH 相关则 /search 返回 5030（安全降级）
      SEARCH_ENABLED: ${SEARCH_ENABLED:-false}
      SEARCH_ADDRESSES: http://elasticsearch:9200

      # 生产默认关闭 Swagger
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  redisdata:
  esdata:
  uploads:
