# 单服务编排：只跑 fantwo-core（Go 编译产物）
#
# ══════════════════════════════════════════════════════════════════════════
#  本 compose 只定义 app 一个服务。PostgreSQL / Redis / Elasticsearch
#  都在【别的容器】里（1panel 应用商店装的、或独立部署的），这里只管连接。
#
#  用法：
#      cp .env.example .env      # 填 JWT_SECRET / POSTGRES_PASSWORD / 数据库地址
#      docker compose up -d --build
#      curl http://127.0.0.1:3000/health
#
#  为什么只有一个服务：
#      生产环境的 PG/Redis/ES 通常由面板或 DBA 统一管理（备份、监控、升级），
#      和业务容器混在一个 compose 里会导致「删编排连库一起删」的事故。
# ══════════════════════════════════════════════════════════════════════════
#
# ── 关于网络（最关键的一步）───────────────────────────────────────────────
#  容器间用【容器名】互访，前提是它们在同一个 Docker 网络里。
#  1panel 装的容器通常在 `1panel-network`，本服务默认也加入这个网络。
#
#  先确认网络名：
#      docker inspect <PG容器名> --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}'
#
#  然后在 .env 里设：
#      EXTERNAL_NETWORK=1panel-network
#      POSTGRES_HOST=<PG容器名，如 1Panel-postgresql-xxxx>
#      REDIS_ADDR=<Redis容器名>:6379
#
#  如果你的 PG/Redis 是宿主机端口映射（不走容器名），把 EXTERNAL_NETWORK 留空
#  并改用 host.docker.internal（见文件末尾注释）。
#
# ── 关于构建 ──────────────────────────────────────────────────────────────
#  编译在容器内进行（from-source），宿主机不需要装 Go。
#  想用提前交叉编译好的二进制（秒级）就设 BUILD_TARGET=from-binary，
#  并把二进制放到 dist/fantwo-core-linux-amd64。

name: fantwo-core

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.binary
      # from-source：编译也在容器里（宿主机零依赖，推荐）
      # from-binary：只 COPY 宿主机已有的 dist/ 二进制（秒级重建）
      target: ${BUILD_TARGET:-from-source}
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        WITH_FFMPEG: ${WITH_FFMPEG:-true}
        BINARY: ${BINARY_PATH:-dist/fantwo-core-linux-amd64}
    # ⚠️ 刻意不写 image: 字段。
    #
    # 原因：1panel 的「创建编排」会先对每个 service 的 image 执行 docker pull，
    # 再去 build。若这里写 `image: fantwo-core:latest`，1panel 会去 Docker Hub 拉
    # 一个不存在的镜像 → 报 "error from registry: denied" / 拉取超时，编排直接失败。
    #
    # 不写 image 时 compose 自动命名为 <项目名>-<服务名>（即 fantwo-core-app），
    # 1panel 找不到可拉取的远程名，就直接走 build。
    # pull_policy: build 是第二道保险（`docker compose pull` 会把 app 标记为 Skipped）。
    pull_policy: build
    container_name: fantwo-core
    restart: unless-stopped
    networks:
      - ext
    environment:
      SERVER_PORT: "3000"
      SERVER_MODE: release
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-Asia/Shanghai}

      # ---- 数据库（外面已有的容器，用容器名或 IP）----
      POSTGRES_HOST: ${POSTGRES_HOST:?POSTGRES_HOST 必须设置（PG 容器名或 IP）}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须设置}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-fantwo_core}
      POSTGRES_SSL_MODE: ${POSTGRES_SSL_MODE:-disable}

      # ---- Redis（外面已有的容器）----
      REDIS_ADDR: ${REDIS_ADDR:?REDIS_ADDR 必须设置（如 redis:6379）}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      # ---- JWT ----
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 必须设置（用 openssl rand -hex 32 生成）}
      JWT_ISSUER: fantwo-core
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-168h}

      # ---- 存储 ----
      # local：上传文件落 /app/uploads（挂卷）
      # s3：走对象存储，需同时配下面的 S3_* 系列
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /app/uploads
      # S3_* 与 CDN 只能在启动时生效，改了要重启容器：
      # S3_ENDPOINT: ""
      # S3_BUCKET: ""
      # S3_ACCESS_KEY: ""
      # S3_SECRET_KEY: ""
      # S3_REGION: "us-east-1"
      # S3_USE_SSL: "false"
      # S3_FORCE_PATH_STYLE: "true"
      # CDN_BASE_URL: ""

      # ---- 全文检索（ES 在另一个容器）----
      # 不启用就设 SEARCH_ENABLED=false；/search 会降级返回 5030，其它业务不受影响。
      SEARCH_ENABLED: ${SEARCH_ENABLED:-false}
      SEARCH_ADDRESSES: ${SEARCH_ADDRESSES:-}
      SEARCH_USERNAME: ${SEARCH_USERNAME:-}
      SEARCH_PASSWORD: ${SEARCH_PASSWORD:-}
      SEARCH_ARTICLES_INDEX: ${SEARCH_ARTICLES_INDEX:-picart_articles}

      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    ports:
      # 唯一对外端口。生产建议前面套 Nginx / Caddy 做 TLS。
      #
      # APP_BIND_IP 控制绑哪个网卡：
      #   0.0.0.0（默认）→ 公网可直接访问（APP_PORT 需在防火墙上放行）
      #   127.0.0.1     → 只能本机访问，由 Nginx/Caddy 反代出去（更安全，推荐）
      #
      # ⚠️ 报 "Bind for 0.0.0.0:3000 failed: port is already allocated" 时：
      #    宿主机 3000 端口被别的程序占了。先查是谁：
      #        ss -lntp | grep :3000          # 或 netstat -lntp | grep :3000
      #        docker ps --format '{{.Names}}\t{{.Ports}}' | grep 3000
      #    两种解法：
      #      a) 改 .env 的 APP_PORT=3100（推荐，不动别人）
      #      b) 停掉占用者
      - "${APP_BIND_IP:-0.0.0.0}:${APP_PORT:-3000}:3000"
    volumes:
      # 上传文件必须持久化，否则容器重建后用户图片全丢。
      # 用命名卷而非绑定挂载：镜像里 /app/uploads 的属主是 appuser(10001)，
      # 命名卷首次挂载会沿用该属主；绑定挂载会变成宿主机 root 属主 → 应用写不进去。
      # 想用绑定挂载（便于 1panel 备份）见文档：需先 chown 10001:10001 ./data/uploads
      - uploads:/app/uploads
    # Linux 下访问宿主机端口（PG/Redis 只在宿主机监听时用）
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  uploads:

networks:
  # 外部网络（已存在，不由本 compose 创建）。
  # 名字用 .env 的 EXTERNAL_NETWORK 指定，默认 1panel-network。
  #
  # ⚠️ 如果这个网络不存在，compose up 会报
  #    network 1panel-network declared as external, but could not be found
  # 两种情况：
  #   a) 1panel 装的容器 → 先 docker network ls 确认真实名字，填进 .env
  #   b) PG/Redis 走宿主机端口 → 把整个 networks/ext 段和 app.networks 删掉，
  #      改用 POSTGRES_HOST=host.docker.internal（app 会自动用默认网络）
  ext:
    external: true
    name: ${EXTERNAL_NETWORK:-1panel-network}