# 一键部署编排：PostgreSQL + Redis + 应用（Elasticsearch 可选）
#
# ══════════════════════════════════════════════════════════════════════════
#  一条命令完成全部（宿主机不需要装 Go，编译在容器内进行）：
#
#      cp .env.example .env      # 填 JWT_SECRET 与 POSTGRES_PASSWORD
#      docker compose up -d --build
#      curl http://127.0.0.1:3000/health
#
# ══════════════════════════════════════════════════════════════════════════
#
# 构建二选一（由 .env 的 BUILD_TARGET 控制，默认 from-source）：
#
#   BUILD_TARGET=from-source   编译在 Docker 里跑（推荐，宿主机零依赖）
#                              拉 golang:1.26.11 → go mod download → 编译 → 装进 alpine
#
#   BUILD_TARGET=from-binary   只 COPY 宿主机上已有的 Linux 二进制（约 5 秒）
#                              需先在宿主机交叉编译：
#                                CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
#                                  go build -trimpath -ldflags="-s -w" \
#                                  -o dist/fantwo-core-linux-amd64 ./cmd/server
#
# 两种模式产出的运行镜像完全相同：同一个静态二进制 + 同一套运行环境
# （证书 237 个 / TZ=Asia/Shanghai / curl 探针 / ffmpeg / 非 root / 上传目录）。
#
# 需要全文检索时（默认不启动，国内服务器基本拉不动 docker.elastic.co）：
#   docker compose --profile search up -d --build
#   并在 .env 里设 SEARCH_ENABLED=true
#
# 国内服务器拉不到 Docker Hub 官方 tag 时，用 .env 覆盖镜像名：
#   POSTGRES_IMAGE=postgres:latest
#   REDIS_IMAGE=redis:latest
#   POSTGRES_IMAGE=docker.m.daocloud.io/library/postgres:18-alpine

name: fantwo-core

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    container_name: fantwo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # 强制必填：缺了直接报错退出，不会静默用 postgres/postgres 起一个不安全的服务
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须设置（.env 里填）}
      POSTGRES_DB: ${POSTGRES_DATABASE:-fantwo_core}
      LANG: C.UTF-8
      TZ: ${TZ:-Asia/Shanghai}
    # 只绑宿主机回环，不把 5432 暴露在公网。
    # 需要远程连库（pgAdmin/Navicat）请用 SSH 隧道：
    #   ssh -L 5432:127.0.0.1:5432 user@server
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DATABASE:-fantwo_core}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: fantwo-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  elasticsearch:
    image: ${ES_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:8.15.0}
    container_name: fantwo-es
    restart: unless-stopped
    # 可选服务，默认【不启动】
    profiles: ["search"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${ES_PORT:-9200}:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  app:
    build:
      context: .
      dockerfile: Dockerfile.binary
      # from-source：编译也在容器里（宿主机零依赖，推荐）
      # from-binary：只 COPY 宿主机已有的 dist/ 二进制（秒级重建）
      target: ${BUILD_TARGET:-from-source}
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        WITH_FFMPEG: ${WITH_FFMPEG:-true}
        BINARY: ${BINARY_PATH:-dist/fantwo-core-linux-amd64}
    # 自定义 tag 便于回滚：升级时换新版本号，旧 tag 保留
    image: ${APP_IMAGE:-fantwo-core:latest}
    container_name: fantwo-core
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: "3000"
      SERVER_MODE: release
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-Asia/Shanghai}

      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须设置（.env 里填）}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-fantwo_core}
      POSTGRES_SSL_MODE: disable

      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 必须设置（用 openssl rand -hex 32 生成）}
      JWT_ISSUER: fantwo-core
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-168h}

      # 存储：默认本地盘挂卷；用对象存储改 s3 并在下方补 S3_* 系列
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /app/uploads
      # S3_* 是启动期配置，只能走环境变量（改了必须重启容器）
      # S3_ENDPOINT: ""
      # S3_BUCKET: ""
      # S3_ACCESS_KEY: ""
      # S3_SECRET_KEY: ""
      # S3_REGION: "us-east-1"
      # S3_USE_SSL: "false"
      # S3_FORCE_PATH_STYLE: "true"
      # CDN_BASE_URL: ""

      # 全文检索：未起 ES 时必须保持 false（否则 /search 报错而非降级 5030）
      SEARCH_ENABLED: ${SEARCH_ENABLED:-false}
      SEARCH_ADDRESSES: ${SEARCH_ADDRESSES:-http://elasticsearch:9200}

      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    ports:
      # 唯一对外端口。生产建议前面套 Nginx / Caddy 做 TLS
      - "${APP_PORT:-3000}:3000"
    volumes:
      # 上传文件必须挂卷，否则容器重建后用户上传的图片全丢
      - uploads:/app/uploads

volumes:
  pgdata:
  redisdata:
  esdata:
  uploads:
